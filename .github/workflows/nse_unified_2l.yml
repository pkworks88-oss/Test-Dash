name: NSE Unified ₹2L Multi-Asset Auto Trader

on:
  schedule:
    # Every 5 mins during NSE hours (09:20 AM - 03:20 PM IST -> 03:50 - 09:50 UTC, Mon-Fri)
    - cron: '*/5 4-9 * * 1-5'
    # Mandatory 03:15 PM IST (09:45 UTC) Forced EOD Square-Off across Equity & F&O
    - cron: '45 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: nse-unified-2l-runner
  cancel-in-progress: false

jobs:
  run-unified-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Execute AI Cycle + 20-Second High-Frequency Watchdog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "import asyncio, os, json; from engine import run_fast_watchdog_loop; asyncio.run(run_fast_watchdog_loop(os.environ['GEMINI_API_KEY'], json.loads(os.environ['GCP_SERVICE_ACCOUNT_JSON'])))"
