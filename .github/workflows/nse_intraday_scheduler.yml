name: NSE Intraday ₹1L Auto Trader

on:
  schedule:
    - cron: '*/5 4-9 * * 1-5'
    - cron: '45 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-intraday-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Execute Intraday 5-Agent Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "import asyncio, os, json; from engine import run_full_cycle; print(asyncio.run(run_full_cycle(os.environ['GEMINI_API_KEY'], json.loads(os.environ['GCP_SERVICE_ACCOUNT_JSON']))))"
